name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # Zero dependencies, so there is nothing to install.
      - run: npm test
      # The package must run the way the README says, from outside the repo: pack it, install the
      # tarball into an empty project, and use it there.
      - run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm i "$RUNNER_TEMP"/*.tgz
          node --input-type=module -e 'const m = await import("@supersuit/home-screen-app"); if (m.notifyState({ ios: true, standalone: false, hasPush: false, permission: "default", subscribed: false }) !== "install" || m.backReveal(m.backRevealAt(0), 1400).shown !== false) process.exit(1)'
